# Render Blueprint: one web service built from the root Dockerfile. See docs/render.md.
# SQL Server is not offered by Render, so the database lives elsewhere (for example Azure SQL Database).
services:
  - type: web
    name: fpms
    runtime: docker
    plan: free
    region: singapore
    branch: feature/lists-toolbar
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ConnectionStrings__Default
        sync: false # asked for when the Blueprint is created
      - key: SystemAdmin__InitialPassword
        sync: false # first sign-in as "admin" uses this, then asks for a new password
      - key: Authentication__JwtBearer__SecurityKey
        generateValue: true
