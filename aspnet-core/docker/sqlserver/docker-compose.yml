# Local development SQL Server for FPMS.
# Password comes from ./.env (gitignored); copy .env.example to .env first.
# Developer edition is free for development/testing only; production licensing is a separate decision.
name: fpms

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in docker/sqlserver/.env}"
    ports:
      - "1433:1433"
    volumes:
      - fpms-sqldata:/var/opt/mssql
    restart: unless-stopped

volumes:
  fpms-sqldata:
